    <script>
        (function () {
            const timeDiff = Date.now() - 1779775350000;

            function updateBars() {
                const now = Date.now() - timeDiff;
                let elapsedSeconds = (now - 1779775323000) / 1000;

                let newLife = Math.min(Math.round(11 + 1.6666666666667 * elapsedSeconds), 100);
                let newMana = Math.min(Math.round(85 + 1.4166666666667 * elapsedSeconds), 85);

                const headerHP = document.querySelector('.hp-fill');
                const headerMana = document.querySelector('.mp-fill');
                if (headerHP && headerMana) {
                    headerHP.style.height = Math.round((newLife / 100) * 100) + '%';
                    headerMana.style.height = Math.round((newMana / 85) * 100) + '%';
                }
            }

            setInterval(updateBars, 250);
        })();
    </script>
